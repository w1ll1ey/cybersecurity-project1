<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>

<form method="get">
    <input type="text" name="q" value="{{query}}">
    <button type="submit">Search</button>
</form>

{% if query %}
{% for note in notes %}

<p><a href="{% url 'note_id' note.id %}">{{ note.name }}</a></p>

{% empty %}
No notes found.

{% endfor %}
{% endif %}

<p><a href="{% url 'create' %}">Create note</a></p>
