<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>

<p><a href="search">Search for notes</a></p>

{% for note in notes %}

<p><a href="{% url 'note_id' note.id %}">{{ note.name }}</a></p>

{% empty %}
No notes.

{% endfor %}

<p><a href="{% url 'create' %}">Create note</a></p>
